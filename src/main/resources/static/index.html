<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TicketLock – Event Ticketing</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --card: #141a2e;
      --border: #1e2a45;
      --text: #e8eef8;
      --muted: #8b9bb8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    nav { display: flex; gap: 0.5rem; }
    nav button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    nav button:hover, nav button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page { display: none; }
    .page.active { display: block; }
    h2 { margin-bottom: 1.25rem; font-size: 1.4rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .event-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .event-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .event-card h3 { margin-bottom: 0.4rem; }
    .event-card .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.75rem; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-published { background: #065f46; color: #6ee7b7; }
    .badge-draft { background: #78350f; color: #fcd34d; }
    .badge-held { background: #1e3a5f; color: #93c5fd; }
    .badge-confirmed { background: #065f46; color: #6ee7b7; }
    .badge-cancelled, .badge-expired { background: #7f1d1d; color: #fca5a5; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
    input, select, textarea {
      width: 100%;
      background: #0f1525;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 0.9rem;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #059669; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #dc2626; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .seat-map {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 1rem 0;
    }
    .seat {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
      user-select: none;
    }
    .seat.available { background: #1e3a5f; color: #93c5fd; }
    .seat.available:hover { background: var(--accent); color: white; }
    .seat.selected { background: var(--accent); color: white; border-color: #93c5fd; }
    .seat.held { background: #78350f; color: #fcd34d; cursor: not-allowed; }
    .seat.booked { background: #3f3f46; color: #71717a; cursor: not-allowed; }
    .legend { display: flex; gap: 1rem; margin-bottom: 1rem; font-size: 0.8rem; color: var(--muted); }
    .legend span { display: flex; align-items: center; gap: 0.35rem; }
    .legend i {
      width: 14px; height: 14px; border-radius: 4px; display: inline-block;
    }
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 0.9rem 1.25rem;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      z-index: 999;
      max-width: 360px;
      animation: slideIn 0.25s ease;
    }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .empty { text-align: center; color: var(--muted); padding: 3rem 1rem; }
    .booking-summary {
      background: #0f1525;
      border-radius: 10px;
      padding: 1rem;
      margin-top: 1rem;
    }
    .booking-summary .row {
      display: flex;
      justify-content: space-between;
      padding: 0.35rem 0;
      font-size: 0.9rem;
    }
    .price { color: var(--gold); font-weight: 700; }
    .user-pill {
      background: #1e293b;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .tt-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .tt-tab {
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .tt-tab.active { background: var(--accent); border-color: var(--accent); color: white; }
    .actions { display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
      header { flex-direction: column; gap: 0.75rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🎟 TicketLock</div>
    <nav>
      <button class="active" data-page="events">Events</button>
      <button data-page="create-event">Create Event</button>
      <button data-page="bookings">My Bookings</button>
      <button data-page="setup">Setup</button>
    </nav>
    <div class="user-pill" id="userPill">No user</div>
  </header>

  <main>
    <!-- SETUP -->
    <section class="page" id="page-setup">
      <h2>Quick Setup</h2>
      <div class="card">
        <p style="color:var(--muted);margin-bottom:1rem;">Create a user to start booking tickets.</p>
        <div class="form-row">
          <div>
            <label>Name</label>
            <input id="setupName" placeholder="Rahul Sharma" value="Rahul Sharma" />
          </div>
          <div>
            <label>Email</label>
            <input id="setupEmail" placeholder="rahul@example.com" value="rahul@example.com" />
          </div>
        </div>
        <button class="btn" onclick="createUser()">Create User</button>
      </div>
      <div class="card" id="setupStatus" style="display:none;"></div>
    </section>

    <!-- EVENTS LIST -->
    <section class="page active" id="page-events">
      <h2>Published Events</h2>
      <div id="eventsList" class="grid">
        <div class="empty">Loading events...</div>
      </div>
    </section>

    <!-- CREATE EVENT -->
    <section class="page" id="page-create-event">
      <h2>Create Event</h2>
      <div class="card">
        <div class="form-row">
          <div>
            <label>Title</label>
            <input id="evTitle" placeholder="Coldplay Concert 2026" />
          </div>
          <div>
            <label>Venue</label>
            <input id="evVenue" placeholder="DY Patil Stadium" />
          </div>
        </div>
        <div class="form-row">
          <div>
            <label>City</label>
            <input id="evCity" placeholder="Mumbai" />
          </div>
          <div>
            <label>Start Time</label>
            <input id="evStart" type="datetime-local" />
          </div>
        </div>
        <label>Description</label>
        <textarea id="evDesc" rows="2" placeholder="Optional description"></textarea>

        <h3 style="margin:1rem 0 0.75rem;font-size:1rem;">Ticket Types</h3>
        <div id="ttList"></div>
        <button class="btn btn-outline" style="margin-bottom:1rem;" onclick="addTicketTypeRow()">+ Add Ticket Type</button>
        <br/>
        <button class="btn" onclick="createEvent()">Create Event</button>
      </div>
    </section>

    <!-- EVENT DETAIL + SEAT MAP -->
    <section class="page" id="page-event-detail">
      <button class="btn btn-outline" onclick="showPage('events')" style="margin-bottom:1rem;">← Back</button>
      <div id="eventDetail"></div>
    </section>

    <!-- BOOKINGS -->
    <section class="page" id="page-bookings">
      <h2>My Bookings</h2>
      <div id="bookingsList">
        <div class="empty">No bookings yet</div>
      </div>
    </section>
  </main>

  <script>
    const API = '';
    let currentUser = JSON.parse(localStorage.getItem('tl_user') || 'null');
    let selectedSeats = [];
    let currentEvent = null;
    let currentTicketTypes = [];
    let activeTicketTypeId = null;

    // ---------- Navigation ----------
    document.querySelectorAll('nav button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showPage(btn.dataset.page);
      });
    });

    function showPage(name) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const page = document.getElementById('page-' + name);
      if (page) page.classList.add('active');
      if (name === 'events') loadEvents();
      if (name === 'bookings') loadBookings();
      if (name === 'create-event') { document.getElementById('ttList').innerHTML = ''; addTicketTypeRow(); addTicketTypeRow(); }
    }

    function updateUserPill() {
      const el = document.getElementById('userPill');
      el.textContent = currentUser ? `${currentUser.name} (#${currentUser.id})` : 'No user';
    }

    // ---------- Toast ----------
    function toast(msg, type = 'success') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    // ---------- API helper ----------
    async function api(path, options = {}) {
      const res = await fetch(API + path, {
        headers: { 'Content-Type': 'application/json', ...options.headers },
        ...options
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
      return data;
    }

    // ---------- Setup / User ----------
    async function createUser() {
      try {
        const body = {
          name: document.getElementById('setupName').value.trim(),
          email: document.getElementById('setupEmail').value.trim()
        };
        const res = await api('/api/users', { method: 'POST', body: JSON.stringify(body) });
        currentUser = res.data;
        localStorage.setItem('tl_user', JSON.stringify(currentUser));
        updateUserPill();
        document.getElementById('setupStatus').style.display = 'block';
        document.getElementById('setupStatus').innerHTML = `<p style="color:var(--success)">User created: <b>${currentUser.name}</b> (ID: ${currentUser.id})</p>`;
        toast('User created successfully');
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    // ---------- Events ----------
    async function loadEvents() {
      const el = document.getElementById('eventsList');
      try {
        const res = await api('/api/events');
        const events = res.data || [];
        if (!events.length) {
          el.innerHTML = '<div class="empty">No published events yet. Create and publish one!</div>';
          return;
        }
        el.innerHTML = events.map(ev => `
          <div class="event-card" onclick="openEvent(${ev.id})">
            <h3>${ev.title}</h3>
            <div class="meta">${ev.venue} · ${ev.city}</div>
            <div class="meta">${formatDate(ev.startTime)}</div>
            <span class="badge badge-published">PUBLISHED</span>
            <div style="margin-top:0.75rem;font-size:0.85rem;color:var(--muted);">
              ${(ev.ticketTypes || []).map(t => `${t.name}: ₹${t.price} (${t.availableSeats} left)`).join(' · ')}
            </div>
          </div>
        `).join('');
      } catch (e) {
        el.innerHTML = `<div class="empty">Failed to load events: ${e.message}</div>`;
      }
    }

    function addTicketTypeRow() {
      const div = document.createElement('div');
      div.className = 'form-row';
      div.style.marginBottom = '0.5rem';
      div.innerHTML = `
        <div><label>Name</label><input class="tt-name" placeholder="Silver / Gold / VIP" /></div>
        <div><label>Price (₹)</label><input class="tt-price" type="number" placeholder="2500" /></div>
        <div><label>Seats</label><input class="tt-seats" type="number" placeholder="40" /></div>
      `;
      document.getElementById('ttList').appendChild(div);
    }

    async function createEvent() {
      if (!currentUser) return toast('Create a user first (Setup tab)', 'error');
      try {
        const ticketTypes = [...document.querySelectorAll('#ttList .form-row')].map(row => ({
          name: row.querySelector('.tt-name').value.trim(),
          price: parseFloat(row.querySelector('.tt-price').value),
          totalSeats: parseInt(row.querySelector('.tt-seats').value)
        })).filter(t => t.name && t.price && t.totalSeats);

        if (!ticketTypes.length) return toast('Add at least one ticket type', 'error');

        const body = {
          title: document.getElementById('evTitle').value.trim(),
          description: document.getElementById('evDesc').value.trim(),
          venue: document.getElementById('evVenue').value.trim(),
          city: document.getElementById('evCity').value.trim(),
          startTime: document.getElementById('evStart').value || '2026-12-15T19:00:00',
          organizerId: currentUser.id,
          ticketTypes
        };

        const res = await api('/api/events', { method: 'POST', body: JSON.stringify(body) });
        const eventId = res.data.id;

        // Auto-publish
        await api(`/api/events/${eventId}/publish`, { method: 'POST' });
        toast('Event created & published!');
        showPage('events');
        document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.page === 'events'));
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function openEvent(id) {
      try {
        const res = await api(`/api/events/${id}`);
        currentEvent = res.data;
        currentTicketTypes = currentEvent.ticketTypes || [];
        activeTicketTypeId = currentTicketTypes[0]?.id || null;
        selectedSeats = [];
        showPage('event-detail');
        renderEventDetail();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function renderEventDetail() {
      const el = document.getElementById('eventDetail');
      const tt = currentTicketTypes.find(t => t.id === activeTicketTypeId);

      el.innerHTML = `
        <div class="card">
          <h2 style="margin-bottom:0.3rem;">${currentEvent.title}</h2>
          <div class="meta" style="color:var(--muted);margin-bottom:0.5rem;">
            ${currentEvent.venue} · ${currentEvent.city} · ${formatDate(currentEvent.startTime)}
          </div>
          <p style="color:var(--muted);font-size:0.9rem;">${currentEvent.description || ''}</p>
        </div>

        <div class="card">
          <h3 style="margin-bottom:0.75rem;">Select Tickets</h3>
          <div class="tt-tabs">
            ${currentTicketTypes.map(t => `
              <button class="tt-tab ${t.id === activeTicketTypeId ? 'active' : ''}"
                      onclick="switchTicketType(${t.id})">
                ${t.name} — ₹${t.price} <span style="opacity:0.7">(${t.availableSeats} left)</span>
              </button>
            `).join('')}
          </div>

          <div class="legend">
            <span><i style="background:#1e3a5f"></i> Available</span>
            <span><i style="background:var(--accent)"></i> Selected</span>
            <span><i style="background:#78350f"></i> Held</span>
            <span><i style="background:#3f3f46"></i> Booked</span>
          </div>

          <div class="seat-map" id="seatMap"><div class="empty">Loading seats...</div></div>

          <div class="booking-summary" id="bookingSummary" style="display:none;"></div>
          <div class="actions">
            <button class="btn" id="bookBtn" disabled onclick="bookSeats()">Book Selected Seats</button>
          </div>
        </div>
      `;

      if (activeTicketTypeId) await loadSeats(activeTicketTypeId);
    }

    function switchTicketType(id) {
      activeTicketTypeId = id;
      selectedSeats = [];
      renderEventDetail();
    }

    async function loadSeats(ticketTypeId) {
      const map = document.getElementById('seatMap');
      try {
        const res = await api(`/api/seats/ticket-type/${ticketTypeId}`);
        const seats = res.data || [];
        if (!seats.length) {
          map.innerHTML = '<div class="empty">No seats</div>';
          return;
        }
        map.innerHTML = seats.map(s => {
          const status = s.status.toLowerCase();
          const isSelected = selectedSeats.includes(s.id);
          const cls = isSelected ? 'selected' : status;
          const clickable = status === 'available' || isSelected;
          return `<div class="seat ${cls}"
                       data-id="${s.id}"
                       data-num="${s.seatNumber}"
                       data-status="${status}"
                       onclick="${clickable ? `toggleSeat(${s.id}, '${s.seatNumber}')` : ''}"
                       title="${s.seatNumber} (${s.status})">${s.seatNumber}</div>`;
        }).join('');
      } catch (e) {
        map.innerHTML = `<div class="empty">${e.message}</div>`;
      }
    }

    function toggleSeat(id, num) {
      const idx = selectedSeats.indexOf(id);
      if (idx >= 0) selectedSeats.splice(idx, 1);
      else selectedSeats.push(id);
      // Re-render seat classes
      document.querySelectorAll('.seat').forEach(el => {
        const sid = parseInt(el.dataset.id);
        const status = el.dataset.status;
        if (selectedSeats.includes(sid)) {
          el.className = 'seat selected';
        } else {
          el.className = 'seat ' + status;
        }
      });
      updateSummary();
    }

    function updateSummary() {
      const box = document.getElementById('bookingSummary');
      const btn = document.getElementById('bookBtn');
      if (!selectedSeats.length) {
        box.style.display = 'none';
        btn.disabled = true;
        return;
      }
      const tt = currentTicketTypes.find(t => t.id === activeTicketTypeId);
      const total = (tt?.price || 0) * selectedSeats.length;
      box.style.display = 'block';
      box.innerHTML = `
        <div class="row"><span>Seats</span><span>${selectedSeats.length} selected</span></div>
        <div class="row"><span>Type</span><span>${tt?.name || ''}</span></div>
        <div class="row"><span>Total</span><span class="price">₹${total.toLocaleString()}</span></div>
      `;
      btn.disabled = false;
    }

    async function bookSeats() {
      if (!currentUser) return toast('Create a user first (Setup tab)', 'error');
      if (!selectedSeats.length) return;

      try {
        const body = {
          userId: currentUser.id,
          eventId: currentEvent.id,
          seatIds: selectedSeats,
          idempotencyKey: 'ui-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8)
        };
        const res = await api('/api/bookings', { method: 'POST', body: JSON.stringify(body) });
        const booking = res.data;
        toast(`Booked! Ref: ${booking.bookingReference} — complete payment before hold expires`);
        selectedSeats = [];
        await loadSeats(activeTicketTypeId);
        updateSummary();
      } catch (e) {
        toast(e.message, 'error');
        await loadSeats(activeTicketTypeId);
      }
    }

    // ---------- Bookings ----------
    async function loadBookings() {
      const el = document.getElementById('bookingsList');
      if (!currentUser) {
        el.innerHTML = '<div class="empty">Create a user first (Setup tab)</div>';
        return;
      }
      try {
        const res = await api(`/api/bookings/user/${currentUser.id}`);
        const bookings = res.data || [];
        if (!bookings.length) {
          el.innerHTML = '<div class="empty">No bookings yet</div>';
          return;
        }
        el.innerHTML = bookings.map(b => `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
              <strong>${b.bookingReference}</strong>
              <span class="badge badge-${b.status.toLowerCase()}">${b.status}</span>
            </div>
            <div style="color:var(--muted);font-size:0.85rem;margin-bottom:0.5rem;">
              ${b.eventTitle} · Seats: ${(b.seats || []).map(s => s.seatNumber).join(', ')}
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="price">₹${Number(b.totalAmount).toLocaleString()}</span>
              <div class="actions" style="margin:0;">
                ${b.status === 'HELD' ? `
                  <button class="btn btn-success" onclick="confirmBooking('${b.bookingReference}')">Confirm</button>
                  <button class="btn btn-danger" onclick="cancelBooking('${b.bookingReference}')">Cancel</button>
                ` : ''}
              </div>
            </div>
            ${b.holdExpiresAt && b.status === 'HELD' ? `
              <div style="margin-top:0.5rem;font-size:0.8rem;color:var(--warning);">
                Hold expires: ${formatDate(b.holdExpiresAt)}
              </div>` : ''}
          </div>
        `).join('');
      } catch (e) {
        el.innerHTML = `<div class="empty">${e.message}</div>`;
      }
    }

    async function confirmBooking(ref) {
      try {
        await api(`/api/bookings/${ref}/confirm`, { method: 'POST' });
        toast('Booking confirmed!');
        loadBookings();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function cancelBooking(ref) {
      try {
        await api(`/api/bookings/${ref}/cancel`, { method: 'POST' });
        toast('Booking cancelled, seats released');
        loadBookings();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    // ---------- Utils ----------
    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleString('en-IN', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    // Init
    updateUserPill();
    loadEvents();
    if (!currentUser) {
      // gently point to setup
    }
  </script>
</body>
